<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akura Villas — Luxury Villa Investment in Bali & Lombok</title>

  <!-- Tailwind config (must precede CDN) -->
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            batu:   '#3A4034',
            padang: '#93A275',
            kayu:   '#76655C',
            padi:   '#EEEDEB',
            kabut:  '#4A4741',
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            body:    ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- React 18 + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --batu:   #3A4034;
      --padang: #93A275;
      --kayu:   #76655C;
      --padi:   #EEEDEB;
      --kabut:  #4A4741;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'DM Sans', system-ui, sans-serif; }
    body { background: var(--padi); color: var(--kabut); }

    /* Subtle grain */
    body::after {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%; height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }

    /* ── Scroll reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition:
        opacity  0.8s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.in-view { opacity: 1; transform: translateY(0); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.25s ease;
    }
    .btn:active  { transform: scale(0.97) !important; }
    .btn:focus-visible { outline: 2px solid var(--padang); outline-offset: 3px; }

    .btn-dark {
      background: var(--batu);
      color: var(--padi);
      border: 1.5px solid var(--batu);
    }
    .btn-dark:hover { background: transparent; color: var(--batu); }

    .btn-ghost-light {
      background: transparent;
      color: var(--padi);
      border: 1.5px solid rgba(238,237,235,0.32);
    }
    .btn-ghost-light:hover {
      background: rgba(238,237,235,0.08);
      border-color: rgba(238,237,235,0.6);
    }

    .btn-ghost-dark {
      background: transparent;
      color: var(--batu);
      border: 1.5px solid rgba(58,64,52,0.22);
    }
    .btn-ghost-dark:hover {
      background: rgba(58,64,52,0.06);
      border-color: rgba(58,64,52,0.45);
    }

    .btn-wa {
      background: #25D366;
      color: #fff;
      border: 1.5px solid #25D366;
      box-shadow: 0 4px 18px rgba(37,211,102,0.28);
    }
    .btn-wa:hover {
      background: #1ebe5d;
      box-shadow: 0 6px 26px rgba(37,211,102,0.4);
      transform: translateY(-1px);
    }

    /* ── Feature card ── */
    .feature-card {
      transition:
        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.35s ease;
    }
    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 64px rgba(58,64,52,0.1) !important;
    }

    /* ── Logo items ── */
    .logo-item {
      opacity: 0.38;
      transition: opacity 0.3s ease;
    }
    .logo-item:hover { opacity: 0.72; }

    /* ── Nav link underline ── */
    .nav-link {
      position: relative;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1px;
      background: currentColor;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-link:hover::after { width: 100%; }

    /* ── WhatsApp FAB ── */
    .wa-fab {
      transition:
        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.3s ease;
    }
    .wa-fab:hover { transform: scale(1.08) translateY(-2px); }
    .wa-fab:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--padi); }
    ::-webkit-scrollbar-thumb { background: var(--padang); border-radius: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .btn, .feature-card, .wa-fab { transition: none !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const WA_LINK = "https://wa.me/6281234567890?text=Hello!%20I%20am%20interested%20in%20learning%20more%20about%20Akura%20Villas.";

    /* ─────────────────────────────────────────────
       Hook: scroll-reveal via IntersectionObserver
    ───────────────────────────────────────────── */
    function useReveal() {
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("in-view");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: "0px 0px -48px 0px" }
        );
        document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

    /* ─────────────────────────────────────────────
       Inline SVG icons
    ───────────────────────────────────────────── */
    const Icon = ({ name, size = 20, ...props }) => {
      const paths = {
        whatsapp: (
          <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
        ),
        trending: (
          <>
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
            <polyline points="16 7 22 7 22 13" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          </>
        ),
        shield: (
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        ),
        leaf: (
          <>
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          </>
        ),
        eye: (
          <>
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" strokeWidth="1.75" fill="none"/>
          </>
        ),
        home: (
          <>
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
            <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          </>
        ),
        users: (
          <>
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx="9" cy="7" r="4" stroke="currentColor" strokeWidth="1.75" fill="none"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          </>
        ),
        arrowUpRight: (
          <path d="M7 17L17 7M17 7H7M17 7v10" stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        ),
        arrowDown: (
          <path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        ),
        instagram: (
          <>
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="currentColor" strokeWidth="1.75" fill="none"/>
            <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z" stroke="currentColor" strokeWidth="1.75" fill="none"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round"/>
          </>
        ),
        linkedin: (
          <>
            <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
            <rect x="2" y="9" width="4" height="12" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx="4" cy="4" r="2" stroke="currentColor" strokeWidth="1.75" fill="none"/>
          </>
        ),
        mail: (
          <>
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
            <polyline points="22,6 12,13 2,6" stroke="currentColor" strokeWidth="1.75" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          </>
        ),
        check: (
          <polyline points="20 6 9 17 4 12" stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        ),
      };

      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          aria-hidden="true"
          {...props}
        >
          {paths[name]}
        </svg>
      );
    };

    /* ─────────────────────────────────────────────
       Eyebrow label
    ───────────────────────────────────────────── */
    function Eyebrow({ children, light = false }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
          <div style={{
            width: "28px", height: "1px",
            background: "var(--padang)",
            flexShrink: 0,
          }} />
          <span style={{
            fontSize: "10px",
            fontWeight: "500",
            letterSpacing: "0.14em",
            textTransform: "uppercase",
            color: "var(--padang)",
          }}>
            {children}
          </span>
        </div>
      );
    }

    /* ─────────────────────────────────────────────
       Nav
    ───────────────────────────────────────────── */
    function Nav() {
      const [scrolled, setScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);

      useEffect(() => {
        const handler = () => setScrolled(window.scrollY > 56);
        window.addEventListener("scroll", handler, { passive: true });
        return () => window.removeEventListener("scroll", handler);
      }, []);

      const linkColor = scrolled ? "var(--batu)" : "rgba(238,237,235,0.72)";

      return (
        <nav
          style={{
            position: "fixed",
            top: 0, left: 0, right: 0,
            zIndex: 50,
            background: scrolled ? "var(--padi)" : "transparent",
            boxShadow: scrolled ? "0 1px 0 rgba(58,64,52,0.08)" : "none",
            transition: "background 0.3s ease, box-shadow 0.3s ease",
          }}
        >
          <div style={{
            maxWidth: "1280px",
            margin: "0 auto",
            padding: "0 24px",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            height: "72px",
          }}>
            {/* Logo */}
            <a href="#" style={{ display: "flex", alignItems: "center" }}>
              <img
                src={scrolled ? "brand assets/1.png" : "brand assets/2.png"}
                alt="Akura Villas"
                style={{ height: "36px", width: "auto" }}
              />
            </a>

            {/* Desktop links */}
            <div style={{ display: "flex", alignItems: "center", gap: "40px" }} className="hidden md:flex">
              {[
                { label: "Portfolio", href: "#portfolio" },
                { label: "Projects",  href: "#projects"  },
                { label: "Philosophy",href: "#philosophy" },
              ].map(({ label, href }) => (
                <a
                  key={label}
                  href={href}
                  className="nav-link"
                  style={{ color: linkColor, fontSize: "13px", fontWeight: "500", letterSpacing: "0.04em" }}
                >
                  {label}
                </a>
              ))}
              <a
                href={WA_LINK}
                target="_blank"
                rel="noopener noreferrer"
                className="btn"
                style={{
                  padding: "9px 20px",
                  fontSize: "11px",
                  background: scrolled ? "var(--batu)" : "transparent",
                  color: "var(--padi)",
                  border: `1.5px solid ${scrolled ? "var(--batu)" : "rgba(238,237,235,0.32)"}`,
                }}
              >
                Get Started <Icon name="arrowUpRight" size={12} />
              </a>
            </div>

            {/* Hamburger */}
            <button
              aria-label="Toggle menu"
              onClick={() => setMobileOpen(!mobileOpen)}
              style={{
                background: "none", border: "none", cursor: "pointer",
                padding: "8px", display: "none",
              }}
              className="block md:hidden"
            >
              {[0, 1, 2].map((i) => (
                <div key={i} style={{
                  width: "20px", height: "1.5px",
                  marginBottom: i < 2 ? "5px" : 0,
                  background: scrolled ? "var(--batu)" : "var(--padi)",
                  transformOrigin: "center",
                  transform: mobileOpen
                    ? i === 0 ? "rotate(45deg) translate(4.5px, 4.5px)"
                    : i === 2 ? "rotate(-45deg) translate(4.5px, -4.5px)"
                    : "none"
                    : "none",
                  opacity: (mobileOpen && i === 1) ? 0 : 1,
                  transition: "transform 0.25s ease, opacity 0.25s ease",
                }} />
              ))}
            </button>
          </div>

          {/* Mobile drawer */}
          {mobileOpen && (
            <div style={{
              background: "var(--padi)",
              padding: "8px 24px 24px",
              borderTop: "1px solid rgba(58,64,52,0.07)",
            }}>
              {[
                { label: "Portfolio", href: "#portfolio" },
                { label: "Projects",  href: "#projects"  },
                { label: "Philosophy",href: "#philosophy" },
              ].map(({ label, href }) => (
                <a
                  key={label}
                  href={href}
                  onClick={() => setMobileOpen(false)}
                  style={{
                    display: "block",
                    padding: "12px 0",
                    color: "var(--batu)",
                    fontSize: "14px",
                    fontWeight: "500",
                    textDecoration: "none",
                    borderBottom: "1px solid rgba(58,64,52,0.06)",
                  }}
                >
                  {label}
                </a>
              ))}
              <div style={{ marginTop: "16px" }}>
                <a
                  href={WA_LINK}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="btn btn-dark"
                  onClick={() => setMobileOpen(false)}
                >
                  Get Started
                </a>
              </div>
            </div>
          )}
        </nav>
      );
    }

    /* ─────────────────────────────────────────────
       Hero — right-side investment card visual
    ───────────────────────────────────────────── */
    function InvestmentCard() {
      return (
        <div style={{ position: "relative", width: "100%", maxWidth: "400px" }}>
          {/* Ambient glow */}
          <div style={{
            position: "absolute",
            inset: "-20px",
            background: "radial-gradient(ellipse at 50% 50%, rgba(147,162,117,0.14) 0%, transparent 70%)",
            borderRadius: "50%",
            pointerEvents: "none",
          }} />

          {/* Card */}
          <div style={{
            position: "relative",
            background: "rgba(238,237,235,0.055)",
            backdropFilter: "blur(24px)",
            WebkitBackdropFilter: "blur(24px)",
            border: "1px solid rgba(238,237,235,0.1)",
            borderRadius: "12px",
            padding: "28px",
          }}>
            {/* Header */}
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: "24px" }}>
              <div>
                <div style={{ fontSize: "10px", letterSpacing: "0.13em", textTransform: "uppercase", color: "var(--padang)", marginBottom: "5px" }}>
                  Akura · Satu
                </div>
                <div style={{ fontFamily: "Cormorant Garamond, serif", fontSize: "20px", fontWeight: "400", color: "var(--padi)", letterSpacing: "-0.01em" }}>
                  Canggu, Bali
                </div>
              </div>
              <div style={{
                background: "rgba(37,211,102,0.14)",
                border: "1px solid rgba(37,211,102,0.25)",
                borderRadius: "20px",
                padding: "4px 11px",
                display: "flex", alignItems: "center", gap: "5px",
              }}>
                <div style={{ width: "6px", height: "6px", borderRadius: "50%", background: "#25D366" }} />
                <span style={{ fontSize: "9px", color: "#3dd87c", fontWeight: "600", letterSpacing: "0.07em" }}>AVAILABLE</span>
              </div>
            </div>

            {/* Metrics */}
            {[
              { label: "Net Annual ROI",  value: "18.5%",      accent: true  },
              { label: "Avg. Occupancy",  value: "84%",        accent: false },
              { label: "Entry Price",     value: "from $185k", accent: false },
              { label: "Est. Payback",    value: "5.4 years",  accent: false },
            ].map(({ label, value, accent }, i, arr) => (
              <div
                key={label}
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  padding: "13px 0",
                  borderBottom: i < arr.length - 1 ? "1px solid rgba(238,237,235,0.07)" : "none",
                }}
              >
                <span style={{ fontSize: "12px", color: "rgba(238,237,235,0.48)" }}>{label}</span>
                <span style={{
                  fontFamily: accent ? "Cormorant Garamond, serif" : "inherit",
                  fontSize: accent ? "20px" : "14px",
                  fontWeight: accent ? "400" : "500",
                  color: accent ? "var(--padang)" : "var(--padi)",
                  letterSpacing: accent ? "-0.02em" : "0",
                }}>
                  {value}
                </span>
              </div>
            ))}

            {/* CTA */}
            <a
              href={WA_LINK}
              target="_blank"
              rel="noopener noreferrer"
              className="btn btn-wa"
              style={{ width: "100%", justifyContent: "center", marginTop: "20px" }}
            >
              <Icon name="whatsapp" size={17} /> Request Info Pack
            </a>
          </div>

          {/* Urgency badge */}
          <div style={{
            position: "absolute",
            top: "-14px", right: "22px",
            background: "var(--padang)",
            borderRadius: "6px",
            padding: "7px 13px",
          }}>
            <span style={{ fontSize: "9px", fontWeight: "700", letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--batu)" }}>
              2 Units Left
            </span>
          </div>

          {/* Decorative corner lines */}
          <div style={{
            position: "absolute",
            bottom: "-18px", left: "-18px",
            width: "40px", height: "40px",
            borderLeft: "1px solid rgba(147,162,117,0.28)",
            borderBottom: "1px solid rgba(147,162,117,0.28)",
            borderRadius: "0 0 0 4px",
          }} />
